name: Hang Probe

# Instrumentation for #250, not a fix, and not part of the PR gate.
#
# The suite has hung in CI often enough to have an issue and rarely enough
# that no run has yet produced a stack: occurrences 1-5 were `test (3.12)`
# on ubuntu under the fork start method, a ~900s stall ending in
# `sqlite3.OperationalError: database is locked` from a forked child, and
# three of them were killed as "cancelled" before any diagnostic could
# fire. #260 pinned spawn at every pool, which should have removed that
# population -- and nothing since has measured whether it did. This
# workflow loops the whole suite, on the platform and interpreter the
# issue was opened on, under both start methods, until one iteration hangs
# or the budget runs out, and it makes sure a hang leaves a stack.
#
# **Dispatched by hand, and only by hand.** It runs for hours, so it is
# never a gate and never on a pull request, a push to main, or the
# release path (`tests.yml` is what `publish.yml` reuses; this file must
# stay out of it). `tests/test_packaging_contract.py::
# test_the_hang_probe_never_runs_on_the_gate` holds the trigger set to
# exactly `workflow_dispatch`.
#
# **It has to be on the default branch before it can be dispatched.**
# GitHub's documentation for the workflow_dispatch event: "This event will
# only trigger a workflow run if the workflow file exists on the default
# branch." Once it is there, `gh workflow run hang-probe.yml -r <branch>`
# runs it against any ref.
#
# **Reading the result.** Each iteration writes one row to the step
# summary, and its outcome is one of these (#427):
#
#   clean         pytest exited 0.
#   failed(rc=N)  pytest exited non-zero, and it was not LOCKED. The loop
#                 goes on: a named failing test is a result, not a hang.
#   LOCKED        non-zero, with occurrence 4/5's `database is locked`.
#                 Blocking.
#   HANG          no new test started for `stall_minutes`. Blocking.
#   HANG(exit)    the run printed its summary and then did not exit for
#                 `stall_minutes`. Blocking: a process that will not exit
#                 is a hang to whoever ran it.
#   SLOW          a test started at or after `per_iteration_minutes`:
#                 still progressing, just slowly. No verdict: a warning,
#                 the loop stops, and the job is green. A run that went
#                 silent before the ceiling is never SLOW. It is judged by
#                 `stall_minutes` alone, so an iteration lasts at most the
#                 ceiling plus the stall.
#   BUDGET        the loop's own budget could not fit another iteration.
#                 No verdict, as for SLOW.
#
# A blocking row turns the job red (`::error::`) and stops the loop. A
# no-verdict row warns (`::warning::`), stops the loop and leaves the job
# green, so re-dispatch as the warning says. Every killed iteration (HANG,
# HANG(exit), SLOW, BUDGET) gets the same USR1 dump before the KILL; a
# SLOW run's dump says where the time went.
#
# **The cadence: before each release, `spawn` arm, ten iterations.**
#
#     gh workflow run hang-probe.yml -r main -f start_method=spawn \
#       -f iterations=10
#
# Ten `clean` rows is the pass. A `HANG`, `HANG(exit)` or `LOCKED` row
# blocks the release and reopens #250. `SLOW` or `BUDGET` is no verdict:
# re-dispatch. Ten iterations take about 140 minutes: healthy spawn
# iterations took 721-836 s across runs 34113535260 to 34492496508.
# Whoever cuts the release dispatches it and
# reads the summary table before tagging. The operational step lives in
# `.agent/workflows/release_process.md` (step 1a) -- which is
# **gitignored**, so it is on the release-cutter's machine and not in
# this repository. That is why the cadence is also written here, in a
# file that ships: a commitment recorded only in an untracked directory
# is a commitment the next contributor cannot read.
#
# **Use `spawn`, not `both`.** `spawn` is what the package does -- all
# four pool sites pin `multiprocessing.get_context("spawn")` (#260). The
# `fork` arm exists only to re-create the population #260 removed (see
# `tests/conftest.py`) and is *expected* to hang: it did so on iteration
# 1 of run 34073209412, while spawn went 20/20 clean across two runs on
# the same commit. Dispatching `both` before a release doubles the
# runtime to re-prove that, and turns the run red on the arm that is
# supposed to fail. Reach for `both` only when reopening the fork
# question itself.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: >
          Full-suite runs per arm. There is no ceiling to compute: the
          loop carries its own 330-minute budget, inside the step's
          340-minute cap, and stops with a BUDGET row rather than start
          an iteration that cannot fit. At the measured 721-836 s per
          iteration, about 23 fit.
        type: number
        required: false
        default: 10
      start_method:
        description: >
          Which multiprocessing start method the suite's pools use.
          `fork` re-creates the population #260 removed (see
          tests/conftest.py); `both` runs the two as parallel jobs.
        type: choice
        options:
          - spawn
          - fork
          - both
        required: false
        default: both
      selection:
        description: >
          Passed to pytest verbatim after `-v`. `tests` is the whole
          suite and the default: the issue's own measurement never
          opened the hang window on a fast subset, and the leaked-thread
          state the occurrence-four dump shows only accumulates over a
          full run. `tests -k FORCE_PROCESSES` (24 tests) is the fast
          re-probe once a hit exists.
        type: string
        required: false
        default: tests
      per_iteration_minutes:
        description: >
          Wall-clock ceiling for an iteration that is still starting
          tests: a test that starts at or after it makes the row SLOW,
          which is no verdict, never HANG. A run that has gone silent is
          judged by stall_minutes alone, so an iteration can last this
          plus stall_minutes. A positive whole number. The default, 45,
          is 3.2 times the slowest healthy iteration measured (836 s).
          Its name was kept so that an existing
          `-f per_iteration_minutes=N` still dispatches.
        type: number
        required: false
        default: 45
      stall_minutes:
        description: >
          An iteration is a HANG when no new test has started for this
          long, or HANG(exit) when that silence follows pytest's
          summary. It counts the test ids pytest -v prints at column 0,
          not the log's size, because the conftest watchdog keeps writing
          through a real hang. 10 is above every internal dump
          (faulthandler_timeout 300 s, the worker's 240 s, the watchdog's
          120 s), so each has fired before the probe kills. Every
          healthy gap between tests measured under 130 s. A positive
          whole number.
        type: number
        required: false
        default: 10

permissions:
  contents: read

concurrency:
  # One group per run, so a second dispatch can never cancel a first. A
  # cancelled probe is exactly the "log naming nothing" this issue is
  # about, and two probes running at once cost runner minutes, not
  # correctness -- they share no state.
  group: hang-probe-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      # Both arms are independent jobs so the two answers arrive in
      # parallel, and one arm hanging must not stop the other.
      fail-fast: false
      matrix:
        start_method: ${{ fromJSON(inputs.start_method == 'both' && '["spawn","fork"]' || format('["{0}"]', inputs.start_method)) }}
    # Backstop only. Same inequality tests.yml carries: this must exceed
    # the SUM of every step cap below, or some step's own timeout is
    # unreachable and a hang there dies as 'cancelled' with no failing
    # step in the log (#243). 356 > 340 (the loop step) + 15 (the five
    # literal 3s), and 356 is inside GitHub's 360-minute job maximum.
    #
    # **A literal, because GitHub Actions expressions have no arithmetic
    # operators.** This was written as a product of the two inputs plus
    # 25 when the probe first merged, and the whole workflow was
    # unparseable: `gh workflow run` answered `HTTP 422: failed to parse
    # workflow: (Line: 102, Col: 22): Unexpected symbol: '+'`. The
    # documented operator set is `( ) [ ] . ! < <= > >= == != && ||` --
    # no `+`, `-`, `*` or `/` -- so a cap cannot be derived from the
    # inputs at all. These two numbers are therefore sized for the loop
    # script's own **330-minute budget** (#427), not for the inputs of
    # any one run, which makes them a pure backstop: the
    # script ends every iteration itself (stall, ceiling or budget, #427),
    # and its own budget sits inside the loop step's cap, so one of these
    # firing means the script is stuck, and that is the one thing it
    # cannot classify. `test_the_hang_probe_never_runs_on_the_gate`
    # checks the inequality on the two literals and, separately, that no
    # expression in this file contains arithmetic.
    timeout-minutes: 356

    steps:
    - uses: actions/checkout@v7
      timeout-minutes: 3

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      timeout-minutes: 3
      with:
        # The interpreter the issue was opened on. The 2026-09-02/03
        # sightings are macOS / 3.14.6 and are a different platform,
        # start method and interpreter; a macOS arm is an extension of
        # this file, not a default.
        python-version: "3.12"

    - name: Install tesseract
      timeout-minutes: 3
      # Copied from tests.yml, comments included: the probe must run the
      # same suite the gate runs.
      #
      # pytesseract is a wrapper; the OCR itself is a system binary pip
      # cannot supply. Without it `pixel_analysis.HAS_OCR` is still True
      # (it means only that pytesseract imported), but the OCR probe
      # (`pixel_analysis._ocr_unavailable_reason()`, #422) fails and
      # tests/test_discovery_integration.py skips -- which is how that
      # test went unrun for months while the suite looked healthy (#44).
      # A skip caused by a missing system package is indistinguishable
      # from a test that has nothing to say.
      #
      # `update` is deliberately allowed to fail. It exits non-zero if
      # *any* configured source fails, and the runner image ships
      # third-party repositories we neither use nor control: on
      # 2026-08-27 packages.microsoft.com returned 403 for two of them
      # and killed a release rehearsal, because `update && install` under
      # `bash -e` meant `install` never ran. Tesseract comes from
      # azure.archive.ubuntu.com, which was fine throughout.
      #
      # The install is what must succeed, and the version check is what
      # proves it: pip cannot supply this binary, so an install that
      # half-worked would resurface as #44 -- a silent skip that looks
      # like a passing suite.
      run: |
        sudo apt-get update \
          || echo "::warning::apt-get update had failing sources; continuing"
        sudo apt-get install -y tesseract-ocr
        tesseract --version

    - name: Install Dependencies
      timeout-minutes: 3
      run: |
        python -m pip install --upgrade pip
        # setup.py is the single source of truth for dependencies; there is
        # deliberately no requirements.txt to drift from it.
        # `ocr` is installed here but stays an optional extra for users:
        # the no-OCR paths are covered by patching, not by leaving it
        # uninstalled: the tier-2 degradation by patching HAS_OCR
        # (tests/test_pixel_analysis.py), and the Session methods'
        # refusal by patching HAS_OCR and pytesseract together
        # (tests/test_ocr_unavailable_refuses.py, #422).
        pip install -e ".[tests,ocr]"

    - name: Loop the suite until it hangs or the budget runs out
      id: loop
      shell: bash
      # The script's own 330-minute budget plus the last kill sequence,
      # and no more: the script ends every iteration itself (stall,
      # ceiling or budget) and will not start one that cannot fit, for
      # any inputs (#427). So this cap firing means the script itself is
      # stuck, which is the only thing it cannot classify.
      #
      # A literal rather than a product of the inputs, because GHA
      # expressions have no arithmetic operators and the computed form
      # made the workflow unparseable -- see the job cap above for the
      # 422.
      timeout-minutes: 340
      env:
        PYTHON_GIL: "1"
        # Child-side stall diagnostics, as tests.yml sets them: each pool
        # worker arms faulthandler.dump_traceback_later(240, exit=False),
        # so a stuck child dumps its own stack long before the parent is
        # signalled below.
        ISOCENTER_WORKER_FAULTHANDLER: "1"
        # Every iteration is a fresh interpreter over the same checkout;
        # a .pyc from iteration N must not be what iteration N+1 runs
        # (#174).
        PYTHONDONTWRITEBYTECODE: "1"
        # Read by tests/conftest.py only, never by the package: `fork`
        # rebinds `multiprocessing.get_context` so every pool the suite
        # builds forks, re-creating the population #260 removed. Any
        # other value is inert. Test-only on purpose -- a package-level
        # lever to pick fork would bring that population back for users
        # -- which is why it has no row in docs/environment.md.
        ISOCENTER_HANG_PROBE_START_METHOD: ${{ matrix.start_method }}
        # Free-form input, so it reaches the script through the
        # environment rather than being interpolated into it.
        PROBE_SELECTION: ${{ inputs.selection }}
      run: |
        # `set +e`, explicitly, and it is load-bearing: GitHub runs a
        # `shell: bash` step as `bash --noprofile --norc -eo pipefail
        # {0}`, so `-e` is live before the first line of this script
        # and `set -u` alone leaves it on. Under `-e` the `wait "$pid";
        # rc=$?` below exits the script on the first non-zero pytest --
        # a plain failing test, a LOCKED run and a killed HANG all end
        # with no summary row and no `::error::`, and the pipefail'd
        # `grep | tail` for the last item exits it on a log with no test
        # items. Measured with a fake pytest under those exact flags.
        # Every exit status this script cares about is read explicitly
        # into `rc` and classified; nothing here may exit on its own.
        # `test_the_hang_probe_never_runs_on_the_gate` asserts this line
        # is present, because nothing else can see the shell's flags.
        set +e -u
        # **The two minute inputs are positive whole numbers, or nothing
        # runs.** GitHub's `type: number` accepts `12.5`, and
        # `$(( 12.5 * 60 ))` is a bash syntax error that ends this script
        # before its first row, with no `::error::`: an unexplained red.
        # `0` would make every poll a HANG, and a leading `0` is octal
        # inside `$(( ))`, so `08` is an error and `010` is eight.
        for pair in "stall_minutes=${{ inputs.stall_minutes }}" \
                    "per_iteration_minutes=${{ inputs.per_iteration_minutes }}"; do
          case "${pair#*=}" in
            ''|0*|*[!0-9]*)
              echo "::error::${pair%%=*} must be a positive whole number of minutes, got '${pair#*=}'"
              exit 1;;
          esac
        done
        mkdir -p probe-logs
        # Test-only knobs. All are unset in CI, so each takes the default
        # after `:-`, which is the production value.
        # tests/test_hang_probe_loop.py sets them to run the real script
        # in seconds. tests/test_packaging_contract.py pins every default,
        # and checks that no `env:` in this file sets them. Like
        # ISOCENTER_HANG_PROBE_START_METHOD they are not package
        # variables, and docs/environment.md's registry test scans the
        # package, not workflows, so they have no row there.
        unit=${PROBE_UNIT_S:-60}      # seconds per input "minute"
        poll=${PROBE_POLL_S:-5}       # never inside $(( )): a test sets 0.2
        grace=${PROBE_GRACE_S:-45}    # USR1 -> KILL: the parent's dump plus margin
        margin=${PROBE_MARGIN_S:-10}  # slack left between an iteration and the budget
        # The loop's own end: a literal, 10 minutes inside the step's 340.
        # An iteration that cannot fit is never started (BUDGET), and a
        # started one is limited to what is left, so no input can make
        # the step cap fire mid-iteration (#243, #427).
        budget=${PROBE_BUDGET_S:-$(( 330 * 60 ))}
        stall=$(( ${{ inputs.stall_minutes }} * unit ))
        ceiling=$(( ${{ inputs.per_iteration_minutes }} * unit ))
        loop_start=$(date +%s)
        longest=0
        # On the fork arm the two tests that pin spawn are red by
        # construction -- that is what the arm does -- and are not what
        # it measures, so they are deselected rather than reported.
        deselect=""
        if [ "${{ matrix.start_method }}" = "fork" ]; then
          deselect="--deselect tests/test_parallel_contract.py::test_the_per_call_process_pool_pins_spawn --deselect tests/test_parallel_contract.py::test_the_shared_session_executor_pins_spawn"
        fi
        printf '| iter | outcome | seconds | last item |\n|---|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
        for i in $(seq 1 ${{ inputs.iterations }}); do
          log="probe-logs/${{ matrix.start_method }}-iter-$i.log"
          left=$(( budget - ($(date +%s) - loop_start) ))
          # Not started unless the longest iteration so far still fits,
          # and the kill sequence with it. `longest` is 0 before the
          # first iteration, so the second test is what refuses a budget
          # too small to start at all.
          if [ "$left" -lt "$longest" ] || [ $(( left - grace - margin )) -le 0 ]; then
            printf '| %s | BUDGET | 0 | not started: %ss of budget left, longest iteration %ss |\n' "$i" "$left" "$longest" >> "$GITHUB_STEP_SUMMARY"
            echo "iteration $i: BUDGET, not started (${left}s left, longest ${longest}s)"
            echo "::warning::BUDGET before iteration $i: ${left}s of the loop's budget left and the longest iteration took ${longest}s, so it was not started -- no verdict; re-dispatch with fewer iterations"
            break
          fi
          # What the budget leaves this iteration, with the kill's grace
          # and the margin reserved. This limit is hard: past it the
          # step cap fires mid-iteration (#243), silent run or not.
          hard=$(( left - grace - margin ))
          start=$(date +%s)
          # `-u -v`, redirected to a file, and never through a pipe: `-q`
          # buffers and a pipe adds a second buffer, so a killed run's
          # log ends somewhere before where it actually was, and cannot
          # be told from a hang at that point. With `-v` the last line
          # names the last test item that started.
          #
          # `setsid` so pytest owns a process group of its own. The
          # spawned pool children join that group, and the KILL below
          # is sent to the group -- a KILL to the parent alone leaves
          # stuck children holding the sidecar and the database, and
          # the next iteration inherits them.
          setsid python -u -m pytest -v -p no:cacheprovider $PROBE_SELECTION $deselect > "$log" 2>&1 &
          pid=$!
          seen=""; moved=$start; outcome=""
          while :; do
            if ! kill -0 "$pid" 2>/dev/null; then wait "$pid"; rc=$?; break; fi
            now=$(date +%s)
            # **Progress is the count of tests started, anchored at
            # column 0.** `-v` prints each test's node id at column 0 as
            # it starts. The conftest stall watchdog keeps writing through
            # a real hang, re-dumping every 120s and naming the stuck test
            # *indented* (`  last test item : tests/...`), as do
            # faulthandler's `File "..."` frames. So the log's size, its
            # mtime, and an unanchored count all move during a hang, and a
            # detector built on any of them never fires: run 34073209412's
            # fork log grew for 850s with one test in flight. Keep the `^`.
            #
            # `grep -c` prints 0 and exits 1 on no match, which is safe
            # only because `set +e` is on; see the top of this script.
            n=$(grep -c '^tests/[^ ]*::' "$log" 2>/dev/null)
            # **The summary line is progress too.** Run 34488760203 was
            # killed as a HANG by the old wall-clock deadline 0.5s after
            # pytest printed `1855 passed, 1 skipped in 899.50s`, inside
            # interpreter teardown. With the summary in the token, silence
            # after it is told apart as HANG(exit): still blocking, since
            # a process that will not exit is a hang, but named for what
            # it is.
            if grep -Eq '^=+ .* in [0-9.]+s' "$log" 2>/dev/null; then fin=1; else fin=0; fi
            if [ "$n:$fin" != "$seen" ]; then seen="$n:$fin"; moved=$now; fi
            # **SLOW is keyed on `moved`, the last progress, not on
            # `now`.** The ceiling is for a run still starting tests. On
            # `now`, a stall that began less than `stall` before the
            # ceiling met the ceiling first and read as SLOW: green, "not
            # a hang". At the documented per_iteration_minutes=25, a
            # teardown hang after run 34488760203's summary at 899.5 s
            # would have been SLOW at 1500 s after 600 s of silence (the
            # PR #480 review). On `moved`, a silent run falls through to
            # the stall check, so an iteration ends by ceiling + stall.
            # The budget stays keyed on `now`: it is the hard one.
            if [ $(( now - moved )) -ge "$stall" ]; then
              if [ "$fin" = 1 ]; then outcome="HANG(exit)"; else outcome="HANG"; fi
            elif [ $(( now - start )) -ge "$hard" ]; then
              outcome="BUDGET"
            elif [ $(( moved - start )) -ge "$ceiling" ]; then
              outcome="SLOW"
            fi
            if [ -n "$outcome" ]; then
              # USR1 to the parent only, not TERM: pytest's faulthandler
              # registers the fatal signals (SEGV, FPE, ABRT, BUS, ILL)
              # and nothing else, so a TERM produces no dump at all --
              # the issue's own retraction measured exactly that.
              # tests/conftest.py registers SIGUSR1 with faulthandler on
              # the channel the stall watchdog already owns, so every
              # thread in the parent dumps into this log. Children get
              # no USR1 (their default disposition would kill them,
              # dumping nothing); a stuck child has had its own 240s
              # watchdog fire long before this point.
              kill -USR1 "$pid" 2>/dev/null; sleep "$grace"
              # `grace` (45s) is the parent's dump plus margin; then the
              # whole group goes, so nothing survives into the next
              # iteration.
              kill -KILL -- "-$pid" 2>/dev/null; wait "$pid" 2>/dev/null
              rc=124; break
            fi
            sleep "$poll"
          done
          secs=$(( $(date +%s) - start ))
          if [ "$secs" -gt "$longest" ]; then longest=$secs; fi
          last=$(grep -Eo 'tests/[^ ]+::[^ ]+' "$log" | tail -1)
          if [ -z "$outcome" ]; then
            if [ "$rc" -eq 0 ]; then outcome="clean"
            # Occurrence 4/5's recorded signature. Measured against the
            # four test files that mention the phrase in their source: a
            # green `-v` log contains it zero times, so this cannot
            # classify a passing run as LOCKED.
            elif grep -q "database is locked" "$log"; then outcome="LOCKED"
            else outcome="failed(rc=$rc)"; fi
          fi
          printf '| %s | %s | %s | %s |\n' "$i" "$outcome" "$secs" "$last" >> "$GITHUB_STEP_SUMMARY"
          echo "iteration $i: $outcome in ${secs}s (last: $last)"
          # HANG, HANG(exit) and LOCKED stop the loop red: the logs are
          # the deliverable and further iterations only bury them. LOCKED
          # is the recorded occurrence signature and, after #260, should
          # be impossible under spawn -- one under spawn falsifies the
          # fork hypothesis on its own. SLOW and BUDGET stop it green with
          # a warning: neither is a finding, and the next iteration could
          # not say more. A plain failure is recorded and the loop
          # continues: a named failing test is a result, not a hang, and a
          # repeat across iterations is its own issue.
          case "$outcome" in
            HANG|"HANG(exit)"|LOCKED)
              echo "::error::$outcome on iteration $i"; exit 1;;
            SLOW)
              echo "::warning::SLOW on iteration $i: still starting tests at ${secs}s (last: $last) -- not a hang; no verdict, re-dispatch with a higher per_iteration_minutes"; break;;
            BUDGET)
              echo "::warning::BUDGET on iteration $i: the loop's budget ran out at ${secs}s while tests were still starting (last: $last) -- no verdict; re-dispatch with fewer iterations"; break;;
          esac
        done

    - name: Upload every iteration's log
      # The logs are the whole point, so they upload whether the loop
      # found a hang, ran clean, or was killed by its own cap.
      if: always()
      uses: actions/upload-artifact@v7
      timeout-minutes: 3
      with:
        name: hang-probe-${{ matrix.start_method }}-${{ github.run_id }}
        path: probe-logs/
        # `warn`, not `error`: if a setup step failed before the loop
        # ran there are no logs, and that step is already the red.
        # Turning the upload red as well would be a second failure for
        # one cause.
        if-no-files-found: warn
